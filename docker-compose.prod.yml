services:
  rpidaemon:
    extends:
      file: docker-compose.yml
      service: rpidaemon
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LD_LIBRARY_PATH=/opt/vc/lib
    volumes:
      - /home/budor/.microsoft/usersecrets/7a7d43a7-4a55-45c9-b915-7c7aec6d1751:/root/.microsoft/usersecrets/7a7d43a7-4a55-45c9-b915-7c7aec6d1751
      - /home/budor/audioRecordings:/audioRecordings
      - /home/budor/images:/images
      - /opt/vc:/opt/vc
      - /opt/vc/lib:/opt/vc/lib
    depends_on:
      # - birdnetserver
      - audiorecorderlinux
    devices:
      # Camera
      - "/dev/vchiq:/dev/vchiq"
      # GPIO
      - "/sys/class/gpio:/sys/class/gpio"
    privileged: true
    platform: linux/arm64
  birdnetserver:
    extends:
      file: docker-compose.yml
      service: birdnetserver
    platform: linux/arm64
  audiorecorderlinux:
    image: aopheim/audiorecorderlinux:latest
    ports:
      - 4000
    devices:
      - /dev/snd:/dev/snd
      - /usr/share/alsa/alsa.conf:/usr/share/alsa/alsa.conf
    restart: unless-stopped
    volumes:
      - /home/budor/audioRecordings:/audioRecordings
    platform: linux/arm64
