services:
  rpidaemon:
    extends:
      file: docker-compose.yml
      service: rpidaemon
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LD_LIBRARY_PATH=/opt/vc/lib
      - CAMERA_SERVICE_URL=http://picameraserver:8080
    volumes:
      - /home/budor/.microsoft/usersecrets/7a7d43a7-4a55-45c9-b915-7c7aec6d1751:/root/.microsoft/usersecrets/7a7d43a7-4a55-45c9-b915-7c7aec6d1751
      - /home/budor/audioRecordings:/audioRecordings
      - /home/budor/images:/images
      - /opt/vc:/opt/vc
      - /opt/vc/lib:/opt/vc/lib
    depends_on:
      - birdnetserver
      - audiorecorderlinux
      - picameraserver
    devices:
      # GPIO
      - "/sys/class/gpio:/sys/class/gpio"
    privileged: true
    platform: linux/arm64
  picameraserver:
    extends:
      file: docker-compose.yml
      service: picameraserver
  birdnetserver:
    image: aopheim/birdnetserver:latest
    ports:
      - 8080
    restart: unless-stopped
    platform: linux/arm64
    volumes:
      - /home/budor/audioRecordings:/audioRecordings
  audiorecorderlinux:
    image: aopheim/audiorecorderlinux:latest
    ports:
      - 4000
    devices:
      - /dev/snd:/dev/snd
    restart: unless-stopped
    volumes:
      - /home/budor/audioRecordings:/audioRecordings
    platform: linux/arm64
