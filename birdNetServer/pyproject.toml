[tool.poetry]
name = "birdnetserver"
version = "0.1.0"
description = "Docker image of the BirdNet library"
authors = ["Adrian Opheim <adrian.i.opheim@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9, <3.12"
bottle = "^0.12.25"
tflite-runtime="2.10"
librosa="0.9.2"
resampy="0.3.1"
birdnetlib="0.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
